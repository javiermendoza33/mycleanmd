  /v1/orders/{id}/pharmacy:
    put:
      operationId: updateOrderPharmacy
      summary: Before a retail order goes out, set the patient's pharmacy, which the order then goes to;
        once it is at a pharmacy and not picked up, move it.
      tags:
        - Orders
      security:
        - bearer: []
      x-cuvo-scope: patients:write
      x-cuvo-modes:
        - TEST
        - LIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pharmacy_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                type:
                  description: "The `type` the pharmacy was found as in the search. It decides only for a pharmacy
                    that fills both ways: one that fills only one way is that type whatever is sent.
                    Without it, such a pharmacy is taken as pickup."
                  type: string
                  enum:
                    - pickup
                    - mail_order
              required:
                - pharmacy_id
              additionalProperties: false
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^ord_[A-Za-z0-9_-]{1,128}$
        - name: Cuvo-Organization
          in: header
          required: false
          description: The organization to act for, required when the credential is granted to more than one.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: 16 to 128 printable ASCII characters. Retries with the same key replay.
          schema:
            type: string
            minLength: 16
            maxLength: 128
      responses:
        "200":
          description: Before a retail order goes out, set the patient's pharmacy, which the order then goes
            to; once it is at a pharmacy and not picked up, move it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The request failed validation.
          content: *a1
        "401":
          description: The API key is missing, malformed, expired, or revoked.
          content: *a1
        "403":
          description: The credential lacks the scope or the organization grant.
          content: *a1
        "404":
          description: No such resource.
          content: *a1
        "409":
          description: "The Idempotency-Key was reused with a different request, or the order cannot move: it
            is not a retail order, it was picked up, shipped or failed, or the pharmacy network
            refused the move, with its reason (`conflict`)."
          content: *a1
        "413":
          description: The request body exceeded 1 MB.
          content: *a1
        "429":
          description: The credential's rate limit was exhausted.
          content: *a1
        "500":
          description: Something went wrong.
          content: *a1
