paths:
  /v1/organization:
    get:
      operationId: getOrganization
      summary: The organization this credential acts for.
      tags:
        - Organization
      security:
        - bearer: []
      x-cuvo-scope: organization:read
      x-cuvo-modes:
        - TEST
        - LIVE
      parameters:
        - name: Cuvo-Organization
          in: header
          required: false
          description: The organization to act for, required when the credential is granted to more than one.
          schema:
            type: string
      responses:
        "200":
          description: The organization this credential acts for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentOrganization"
        "400":
          description: The request failed validation.
          content: &a1
            application/problem+json:
              schema:
