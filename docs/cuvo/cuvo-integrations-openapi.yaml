openapi: 3.1.0
info:
  title: Cuvo Integrations API
  version: 1.0.0
  description: The public consult platform. A partner creates patients, records consents, files cases
    for a licensed clinician to decide, and follows prescriptions and orders through events and
    webhooks. Test mode runs the whole loop against a sandbox.
servers:
  - url: https://api.cuvo.co
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "A secret key: `cuvo_sk_test_…` in test mode, `cuvo_sk_live_…` in live."
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
      additionalProperties: false
    CurrentOrganization:
      type: object
      properties:
        id:
          type: string
          pattern: ^org_[A-Za-z0-9_-]{1,128}$
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum:
            - DIRECT
            - RESELLER
            - RESELLER_CLIENT
            - INTEGRATION
        status:
          type: string
          enum:
            - active
            - suspended
        mode:
          type: string
          enum:
            - test
            - live
        scopes:
          type: array
          items:
            type: string
            enum:
              - organization:read
              - catalog:read
              - patients:read
              - patients:write
              - files:read
              - files:write
              - consents:read
              - consents:write
              - cases:read
              - cases:write
              - messages:read
              - messages:write
              - orders:read
              - labs:read
              - labs:write
              - visits:read
              - visits:write
              - webhooks:manage
              - events:read
              - realtime:subscribe
              - billing:read
              - products:read
              - purchases:read
              - affiliates:read
              - affiliates:write
              - audit:read
              - test:manage
      required:
        - id
        - name
        - slug
        - kind
        - status
        - mode
        - scopes
      additionalProperties: false
    GrantedOrganization:
      type: object
      properties:
        id:
          type: string
          pattern: ^org_[A-Za-z0-9_-]{1,128}$
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum:
            - DIRECT
            - RESELLER
            - RESELLER_CLIENT
            - INTEGRATION
        status:
          type: string
          enum:
            - active
            - suspended
        scopes:
          type: array
          items:
            type: string
            enum:
              - organization:read
              - catalog:read
              - patients:read
              - patients:write
              - files:read
              - files:write
              - consents:read
              - consents:write
              - cases:read
              - cases:write
              - messages:read
              - messages:write
              - orders:read
              - labs:read
              - labs:write
              - visits:read
              - visits:write
              - webhooks:manage
              - events:read
              - realtime:subscribe
              - billing:read
              - products:read
              - purchases:read
              - affiliates:read
              - affiliates:write
              - audit:read
              - test:manage
      required:
        - id
        - name
        - slug
        - kind
        - status
        - scopes
      additionalProperties: false
    Medication:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
        strength:
          type: string
        form:
          type: string
          enum:
            - tablet
            - capsule
            - injection
            - topical
            - oral_solution
            - sublingual
        pharmacy:
          type: string
          minLength: 1
          maxLength: 64
        states:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        controlled:
          type: boolean
      required:
        - id
        - name
        - strength
        - form
        - pharmacy
        - states
        - controlled
      additionalProperties: false
    Pharmacy:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
        states:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
      required:
        - id
        - name
        - states
      additionalProperties: false
    State:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
        name:
          type: string
        visit_required:
          type: boolean
          description: "Every treatment needs a live video visit here: a case filed without one is refused
            with 409 visit_required."
        visit_required_categories:
          type: array
          items:
            type: string
          description: The treatment categories that need a live video visit here. Empty when visit_required,
            which already covers every category.
        blocked_categories:
          type: array
          items:
            type: string
          description: "The treatment categories not offered here: a case requesting one is refused with 409
            not_available_in_state."
      required:
        - code
        - name
        - visit_required
        - visit_required_categories
        - blocked_categories
      additionalProperties: false
    QuestionSet:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: The slug a case names the set by.
        title:
          type: string
          description: The treatment the set is the intake for.
        category:
          description: The treatment category the set is the intake for, or null. A case naming the set is
            checked against the patient's state under it, for the medications in `medication_ids`
            only.
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: The latest version, or the one asked for.
        published_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          description: When this version was published.
        medication_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: The formulary rows this set is the intake for, from `GET /v1/medications`.
      required:
        - id
        - title
        - category
        - version
        - published_at
        - medication_ids
      additionalProperties: false
    QuestionSetQuestion:
      type: object
      properties:
        id:
          type: string
          description: The answer's `id` on `POST /v1/cases`.
        question:
          type: string
          description: The question as the patient reads it.
        input:
          type: string
          enum:
            - single_choice
            - multi_choice
            - text
            - number
          description: How the patient answers.
        type:
          description: The answer's `type` on `POST /v1/cases`. Absent on height and weight.
          type: string
          enum:
            - choice
            - string
            - number
        required:
          type: boolean
          description: Whether an asked question must be answered.
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable within the question.
              label:
                type: string
                description: What the patient reads, and what the answer carries verbatim.
            required:
              - id
              - label
            additionalProperties: false
        none_option:
          description: The multi-select option that cannot be combined with another.
          type: string
        ask_when:
          description: Absent when the question is always asked.
          type: object
          properties:
            id:
              type: string
              description: The question whose answer decides.
            any_of:
              type: array
              items:
                type: string
              description: Ask when that answer is one of these options.
            trigger_is_multi:
              type: boolean
              description: "That question is a multi-select: ask when any of its picks is listed."
          required:
            - id
            - any_of
            - trigger_is_multi
          additionalProperties: false
        send_as:
          description: "Height and weight: answered as these two numeric answers instead of one."
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              question:
                type: string
              type:
                type: string
                const: number
            required:
              - id
              - question
              - type
            additionalProperties: false
        critical_options:
          description: Options a clinician must acknowledge before deciding the case. Picking one never
            refuses it.
          type: array
          items:
            type: string
      required:
        - id
        - question
        - input
        - required
      additionalProperties: false
    Address:
      type: object
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          pattern: ^[A-Z]{2}$
        postal_code:
          type: string
          pattern: ^\d{5}(-\d{4})?$
      required:
        - line1
        - city
        - state
        - postal_code
      additionalProperties: false
    Patient:
      type: object
      properties:
        id:
          type: string
          pattern: ^pat_[A-Za-z0-9_-]{1,128}$
        external_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: "null"
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        sex_at_birth:
          type: string
          enum:
            - male
            - female
        email:
          anyOf:
            - type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            - type: "null"
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        pharmacy:
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 64
                name:
                  type: string
                address:
                  anyOf:
                    - $ref: "#/components/schemas/Address"
                    - type: "null"
                phone:
                  type:
                    - string
                    - "null"
                type:
                  type: string
                  enum:
                    - pickup
                    - mail_order
                chosen_by:
                  type: string
                  enum:
                    - partner
                    - patient
                    - staff
                    - clinician
                chosen_at:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              required:
                - id
                - name
                - address
                - phone
                - type
                - chosen_by
                - chosen_at
              additionalProperties: false
            - type: "null"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
            maxLength: 500
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - external_id
        - first_name
        - last_name
        - date_of_birth
        - sex_at_birth
        - email
        - phone
        - address
        - pharmacy
        - metadata
        - created_at
        - updated_at
      additionalProperties: false
    ExportJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        patient:
          type: string
          pattern: ^pat_[A-Za-z0-9_-]{1,128}$
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        expires_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: "null"
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        completed_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: "null"
      required:
        - id
        - patient
        - status
        - url
        - expires_at
        - created_at
        - completed_at
      additionalProperties: false
    ExportBundle:
      type: object
      properties:
        patient:
          $ref: "#/components/schemas/Patient"
        cases:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
        files:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^file_[A-Za-z0-9_-]{1,128}$
              patient:
                type: string
                pattern: ^pat_[A-Za-z0-9_-]{1,128}$
              kind:
                type: string
                enum:
                  - photo
                  - id_document
                  - lab_result
                  - other
              filename:
                type: string
              mime:
                type: string
              size:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              status:
                type: string
                enum:
                  - pending
                  - confirmed
              created_at:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              download_url:
                anyOf:
                  - type: string
                    format: uri
                  - type: "null"
              download_url_expires_at:
                anyOf:
                  - type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  - type: "null"
            required:
              - id
              - patient
              - kind
              - filename
              - mime
              - size
              - status
              - created_at
              - download_url
              - download_url_expires_at
            additionalProperties: false
        prescriptions:
          type: array
          items:
            $ref: "#/components/schemas/Prescription"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        generated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - patient
        - cases
        - consents
        - files
        - prescriptions
        - orders
        - generated_at
      additionalProperties: false
    DeletionRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        patient:
          type: string
          pattern: ^pat_[A-Za-z0-9_-]{1,128}$
        status:
          type: string
          enum:
            - received
            - processing
            - completed
        retention:
          type: string
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        completed_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: "null"
      required:
        - id
        - patient
        - status
        - retention
        - created_at
        - completed_at
      additionalProperties: false
    File:
      type: object
      properties:
        id:
          type: string
          pattern: ^file_[A-Za-z0-9_-]{1,128}$
        patient:
          type: string
          pattern: ^pat_[A-Za-z0-9_-]{1,128}$
        kind:
          type: string
          enum:
            - photo
            - id_document
            - lab_result
            - other
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        status:
          type: string
          enum:
            - pending
            - confirmed
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - patient
        - kind
        - filename
        - mime
        - size
        - status
        - created_at
      additionalProperties: false
    FileUpload:
      type: object
      properties:
        id:
          type: string
          pattern: ^file_[A-Za-z0-9_-]{1,128}$
        patient:
          type: string
          pattern: ^pat_[A-Za-z0-9_-]{1,128}$
        kind:
          type: string
          enum:
            - photo
            - id_document
            - lab_result
            - other
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        status:
          type: string
          enum:
            - pending
            - confirmed
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        upload_url:
          type: string
          format: uri
        upload_headers:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        upload_expires_at:
          type: string
          format: date-time
