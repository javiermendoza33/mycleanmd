      x-cuvo-modes:
        - TEST
        - LIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patient:
                  type: string
                  pattern: ^pat_[A-Za-z0-9_-]{1,128}$
                case:
                  type: string
                  pattern: ^case_[A-Za-z0-9_-]{1,128}$
                intake:
                  description: File this intake as a case held for the visit; the clinician decides it at wrap-up.
                    Needs `cases:write` beside `visits:write`. A visit booked without one is a
                    consultation only. Exclusive with `case`.
                  type: object
                  properties:
                    requested_medications:
                      minItems: 1
                      maxItems: 10
                      type: array
                      items:
                        $ref: "#/components/schemas/RequestedMedication"
                    answers:
                      minItems: 1
                      maxItems: 300
                      type: array
                      items:
                        $ref: "#/components/schemas/Answer"
                    consent_ids:
                      minItems: 1
                      maxItems: 10
                      type: array
                      items:
                        type: string
                        pattern: ^cons_[A-Za-z0-9_-]{1,128}$
                    external_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                    metadata:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: string
                        maxLength: 500
                    question_set:
                      description: Check the answers against this published question set before the case is filed. Omit it
                        to file the answers unchecked.
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 64
                          description: The question set's id, from `GET /v1/question_sets`.
                        version:
                          type: integer
                          minimum: 1
                          maximum: 9007199254740991
                          description: Any published version of the set, not only the latest.
                      required:
                        - id
                        - version
                      additionalProperties: false
                  required:
                    - requested_medications
                    - answers
                    - consent_ids
                  additionalProperties: false
                slot_start:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                audio_only:
                  default: false
                  type: boolean
                treatment:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
                - patient
                - slot_start
              additionalProperties: false
