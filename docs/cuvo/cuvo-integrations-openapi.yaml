        - name: Cuvo-Organization
          in: header
          required: false
          description: The organization to act for, required when the credential is granted to more than one.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: 16 to 128 printable ASCII characters. Retries with the same key replay.
