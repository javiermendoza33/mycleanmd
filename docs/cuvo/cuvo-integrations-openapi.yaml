                requested_medications:
                  minItems: 1
                  maxItems: 10
                  type: array
                  items:
                    $ref: "#/components/schemas/RequestedMedication"
                answers:
                  minItems: 1
                  maxItems: 300
                  type: array
                  items:
                    $ref: "#/components/schemas/Answer"
                files:
                  description: "Confirmed file ids to attach. Test mode only: a live case is refused if this is not
                    empty, because a live file is already filed on the patient's chart and the
                    clinical contract takes no file ids on a case."
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    pattern: ^file_[A-Za-z0-9_-]{1,128}$
                consent_ids:
                  minItems: 1
                  maxItems: 10
                  type: array
                  items:
                    type: string
                    pattern: ^cons_[A-Za-z0-9_-]{1,128}$
                hold:
                  default: false
                  type: boolean
                external_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                metadata:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                    maxLength: 500
                question_set:
                  description: Check the answers against this published question set before the case is filed. Omit it
                    to file the answers unchecked.
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: The question set's id, from `GET /v1/question_sets`.
                    version:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                      description: Any published version of the set, not only the latest.
                  required:
                    - id
                    - version
                  additionalProperties: false
              required:
                - patient
